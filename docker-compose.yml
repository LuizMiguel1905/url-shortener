x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://encurtador:encurtador@db:5432/encurtador
    BASE_URL: http://localhost:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: encurtador
      POSTGRES_PASSWORD: encurtador
      POSTGRES_DB: encurtador
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encurtador"]
      interval: 2s
      retries: 15

  # Roda as migrações uma vez e encerra; a API só sobe se elas passarem.
  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
