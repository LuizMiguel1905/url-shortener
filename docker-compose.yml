x-app: &app
  build:
    context: .
    target: runtime
  environment:
    DATABASE_URL: postgresql+psycopg://encurtador:encurtador@db:5432/encurtador
    BASE_URL: http://localhost:8000
    REDIS_URL: redis://redis:6379/0
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: encurtador
      POSTGRES_PASSWORD: encurtador
      POSTGRES_DB: encurtador
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encurtador"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 2s
      retries: 15

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://encurtador:encurtador@db:5432/encurtador_test
      TEST_REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  k6:
    image: grafana/k6:0.55.0
    profiles: ["load"]
    environment:
      BASE_URL: http://api:8000
      VUS: ${VUS:-50}
      DURATION: ${DURATION:-30s}
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_EXPORT: /loadtest/report.html
    ports:
      - "5665:5665"
    volumes:
      - ./loadtest:/loadtest
    command: run /loadtest/script.js
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
