name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker compose build tests

      - name: Ruff check
        run: docker compose run --rm tests ruff check .

      - name: Ruff format
        run: docker compose run --rm tests ruff format --check .

      - name: Pytest
        run: docker compose run --rm tests pytest
